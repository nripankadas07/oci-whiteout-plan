name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -m compileall -q .
      - run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - run: |
          python -m venv /tmp/installed-tool
          /tmp/installed-tool/bin/python -m pip install --no-index --no-deps wheelhouse/*.whl
          cd /tmp
          /tmp/installed-tool/bin/oci-whiteout-plan "$GITHUB_WORKSPACE/example.json"
